<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 24" width="256" height="96" shape-rendering="crispEdges">
  <!-- Retro 16-Bit Server Rack & Command Monitors -->
  <rect x="2" y="2" width="60" height="20" fill="#f8fafc" />
  
  <!-- Server Rack 1 (Left) -->
  <rect x="4" y="4" width="14" height="16" fill="#1e293b" />
  <rect x="6" y="6" width="10" height="2" fill="#3b82f6" />
  <rect x="6" y="9" width="10" height="2" fill="#10b981" />
  <rect x="6" y="12" width="10" height="2" fill="#f59e0b" />
  <rect x="6" y="15" width="10" height="2" fill="#ef4444" />
  
  <!-- Main Monitor (Center) -->
  <rect x="22" y="4" width="20" height="13" fill="#0f172a" />
  <rect x="24" y="6" width="16" height="9" fill="#0284c7" />
  <!-- Waveform on monitor -->
  <rect x="25" y="11" width="3" height="2" fill="#ffffff" />
  <rect x="28" y="9" width="2" height="4" fill="#ffffff" />
  <rect x="30" y="7" width="2" height="6" fill="#ffffff" />
  <rect x="32" y="10" width="3" height="3" fill="#ffffff" />
  <rect x="35" y="12" width="4" height="1" fill="#ffffff" />
  <!-- Monitor stand -->
  <rect x="30" y="17" width="4" height="2" fill="#475569" />
  <rect x="28" y="19" width="8" height="1" fill="#334155" />

  <!-- Server Rack 2 (Right) -->
  <rect x="46" y="4" width="14" height="16" fill="#1e293b" />
  <rect x="48" y="6" width="10" height="2" fill="#10b981" />
  <rect x="48" y="9" width="10" height="2" fill="#10b981" />
  <rect x="48" y="12" width="10" height="2" fill="#3b82f6" />
  <rect x="48" y="15" width="10" height="2" fill="#10b981" />
</svg>
