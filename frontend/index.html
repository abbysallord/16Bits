<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>16Bits OmniOps | Agentic AI Ops Platform</title>
    <!-- Apply stored theme before first paint to avoid a flash of the wrong palette -->
    <script>
      try {
        var t = localStorage.getItem('omniops_theme')
        document.documentElement.setAttribute('data-theme', t === 'mission' ? 'mission' : 'retro')
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'retro')
      }
    </script>
    <!-- Retro & Code Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
